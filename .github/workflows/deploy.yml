name: Deploy to GitHub Pages

on:
  push:
    branches: [main, patchbay]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          # Served from the custom domain root, so no base path. (configure-pages
          # still reports the github.io origin + /<repo> base even with a CNAME set.)
          SITE_URL: https://www.auer.co
          BASE_PATH: /
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      # Patchbay lives on its own orphan branch (no build step) and is served
      # from /patchbay/ alongside the portfolio.
      - uses: actions/checkout@v7
        with:
          ref: patchbay
          path: patchbay-src
      - run: |
          mkdir -p dist/patchbay
          rsync -a --exclude '.git' --exclude '.claude' --exclude 'CLAUDE.md' patchbay-src/ dist/patchbay/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
