name: Dan Auer
headline: I design systems and interfaces that turn dense data into clear, intelligent experiences.
bio: |-
  I've been a practitioner in design since 2000. I'm grateful to have experience across a growing collection of industries in capacities as an individual contributor, leader, and in mixed roles.

  My primary focus is towards user experience design with a rich background in multi-use design systems meant to support several web properties. I began designing to support user generated content at my first startup in 2008. Beyond UX I have an extensive background in visual communication and visual identity.
